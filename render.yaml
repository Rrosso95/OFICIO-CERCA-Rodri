services:
  - type: web
    name: oficio-cerca
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # true = datos de ejemplo, cuentas demo y aviso de demo. Pon "false" en producción.
      - key: DEMO_MODE
        value: "true"
      - key: DB_PATH
        value: /app/data/oficios.db
      # Datos de ejemplo en Asturias por defecto; define SEED_LAT/SEED_LNG para centrarlos en otro punto
      # Opcional: activa el asistente con Claude (sin ella usa un clasificador básico)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Pagos con Stripe Connect (claves de TEST para probar). Sin STRIPE_SECRET_KEY: simulado si DEMO_MODE=true, si no desactivado.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Avisos por email (SMTP genérico)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Notificaciones push (npx web-push generate-vapid-keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
    # Para conservar los datos entre reinicios: cambia plan a starter y descomenta
    # disk:
    #   name: oficios-data
    #   mountPath: /app/data
    #   sizeGB: 1
